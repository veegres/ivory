name: Release

on:
  release:
    types: [released]

jobs:

  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout & fetch repository
        uses: actions/checkout@v5
      - name: Set up GO
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: server
      - name: Install & Build binary for server
        working-directory: server
        run: |
          go version
          make build
      - name: Upload Artifacts
        uses: actions/upload-artifact@master
        with:
          name: server
          path: server/build

  app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout & fetch repository
        uses: actions/checkout@v5
      - name: Set up Node (yarn, npm)
        uses: actions/setup-node@v5
        with:
          node-version: '25'
      - name: Install & Build app
        working-directory: app
        run: |
          node -v
          npm -v
          npm install
          npm run build
      - name: Upload Artifacts
        uses: actions/upload-artifact@master
        with:
          name: app
          path: app/build

  publish:
    runs-on: ubuntu-latest
    needs: [server, app]
    environment: production
    steps:
      - name: Checkout & fetch repository
        uses: actions/checkout@v5
      - name: Download Service Artifacts
        uses: actions/download-artifact@master
        with:
          name: server
          path: server/build
      - name: Download Web Artifacts
        uses: actions/download-artifact@master
        with:
          name: app
          path: app/build
      - name: Display structure of server files
        run: ls -l
        working-directory: server/build
      - name: Display structure of app files
        run: ls -l
        working-directory: app/build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      - name: Login to DockerHub Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Build and push docker
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IVORY_VERSION_TAG=${{ github.ref_name }}
            IVORY_VERSION_COMMIT=${{ github.sha }}
          tags: |
            veegres/ivory:latest
            veegres/ivory:${{ github.ref_name }}
            aelsergeev/ivory:latest
            aelsergeev/ivory:${{ github.ref_name }}
            ghcr.io/veegres/ivory:latest            
            ghcr.io/veegres/ivory:${{ github.ref_name }}
